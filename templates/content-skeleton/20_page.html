<!-- ============================================================================
     逐页区块骨架（build.py 靠 id="pNN" + data-page="N" 注入缩略图，别改这两个属性）
     下面这一段复制 N 份即为一个分片；分片文件名建议 NN_pXX_pYY.html。
     TODO：把 pg-text 里的「待补」卡片换成真正的讲解。

     ── 多讲课程（v2）：跨讲关联的三个可选属性 ──
     写在区块**开标签上**（即 class / id / data-page 之外再追加），不是写在 h3 或内层 div 上：

       data-concepts   本页引入或重点讲解的概念 id，逗号分隔。小写连字符，中文不要作 id。
                       同时请在本讲收尾的术语表里补一行，并给那一行的 tr 加 data-concept，
                       值与这里一致 —— 术语表是课程层 glossary 的唯一真源。
       data-pays-off   本页回收了前序讲次的伏笔，格式：概念id@L01:p77
       data-forward    本页留下的、后讲应当回收的开放问题，写一个概念 id

     三个属性**都可选**：不写就不进课程索引，但不会让构建失败。
     只有「这门课有前后讲」时才需要；单讲课件完全不用管。
     ============================================================================ -->
<section class="pg" id="p{{nn}}" data-page="{{n}}">
  <div class="pg-head">
    <span class="pg-badge">原文件 P{{n}}</span>
    <h3>{{title_en}} <em>{{title_cn}}</em></h3>
    <a class="pdf-link" data-page="{{n}}">打开原 PDF 该页 ↗</a>
  </div>
  <div class="pg-text">
    <div class="note"><b>待补：</b>这一页的讲解还没写。动笔前先看 <code>_extract/page-{{nn}}.png</code>
      （或右侧缩略图）逐页核对公式与图示——PPT 导出的 PDF 文字层常把数学符号映射坏
      （例如 <code>¡</code> 其实是减号、<code>¼</code> 其实是 π），只读文字层必然讲错公式。</div>
  </div>
  <!-- 缩略图由 build.py 自动插到本区块收尾标签之前，不要手写；
       本注释内不要出现字面标签，否则会干扰 build.py 的区块匹配（见 pitfalls 第 18 条） -->
</section>
